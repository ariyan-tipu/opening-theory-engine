[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opening-theory-engine"
version = "0.1.0"
description = "Chess opening explanations from a small fine-tuned language model, checked against Stockfish ground truth"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ariyan Mohammed Tipu", email = "ariyantipu39@gmail.com" }]
keywords = [
    "chess",
    "llm",
    "fine-tuning",
    "qlora",
    "dpo",
    "stockfish",
    "alignment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "chess>=1.10,<2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "zstandard>=0.22",
    "jax>=0.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=2.6",
    "transformers>=5.14,<6",
    "datasets>=5.0,<6",
    "accelerate>=1.14,<2",
    "peft>=0.19,<1",
    "trl>=1.8,<2",
    "wandb>=0.19",
]
gpu = ["bitsandbytes>=0.45"]
dev = ["pytest>=8.2", "ruff>=0.8"]

[project.scripts]
ote = "opening_theory_engine.cli:main"

[project.urls]
Homepage = "https://github.com/ariyan-tipu/opening-theory-engine"
Repository = "https://github.com/ariyan-tipu/opening-theory-engine"
Issues = "https://github.com/ariyan-tipu/opening-theory-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RET", # return statements
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "engine: requires a real Stockfish binary (set STOCKFISH_PATH or put stockfish on PATH)",
    "train: requires the train extra and downloads a small model from Hugging Face",
]
