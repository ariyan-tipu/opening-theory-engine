name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.22"
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Stockfish so the engine integration tests run
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: pip install -e ".[dev]"
      - run: pytest -q

  train-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache the smoke-test model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-smollm2-135m-instruct
      - run: pip install -e ".[dev,train]"
      - name: A few real optimiser steps of SFT and DPO on CPU
        env:
          OTE_RUN_TRAIN_TESTS: "1"
        run: pytest -q -m train

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opening-theory-engine .
      - name: Boot the container and hit the API
        run: |
          docker run -d --name api -p 8000:8000 opening-theory-engine
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/health
          curl -fs -X POST http://localhost:8000/explain \
            -H 'Content-Type: application/json' \
            -d '{"fen": "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", "move": "e4"}' \
            | python3 -c "import json, sys; body = json.load(sys.stdin); assert body['verification']['passed'] is True, body; print('explain endpoint OK:', body['explanation'].splitlines()[0])"
      - name: Show container logs on failure
        if: failure()
        run: docker logs api
      - name: Stop the container
        if: always()
        run: docker rm -f api
